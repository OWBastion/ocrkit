[project]
name = "bastion-ocr"
version = "0.1.0"
description = "Bastion clear/title OCR microservice"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9.5,<4",
  "fastapi>=0.111.0,<1",
  "numpy>=1.26.4,<3",
  "opencv-python-headless>=4.10.0.84,<5",
  "paddleocr>=2.8.1,<3",
  "pillow>=10.4.0,<12",
  "pydantic>=2.7.4,<3",
  "uvicorn[standard]>=0.30.1,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
