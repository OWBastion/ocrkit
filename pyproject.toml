[project]
name = "ocrkit"
version = "0.1.0"
description = "Overwatch challenge HUD OCR service"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0,<2",
  "fastapi>=0.115.0,<1",
  "numpy>=1.26.4,<3",
  "opencv-python-headless>=4.10.0.84,<5",
  "pydantic>=2.8.0,<3",
  "pydantic-settings>=2.4.0,<3",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0.2,<7",
  "rapidocr>=3.9.1,<4",
  "onnxruntime>=1.19.0,<2",
  "uvicorn[standard]>=0.30.1,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1",
  "pytest>=8.3.2,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
