name: Python

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "configs/**"
      - "scripts/**"
      - "training/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "configs/**"
      - "scripts/**"
      - "training/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test dependencies
        run: uv sync --locked --extra dev

      - name: Run pytest
        run: uv run pytest -q

      - name: Run public run-code smoke evaluation
        run: >-
          uv run python scripts/batch_eval.py
          --only-run-code
          --min-run-code-accuracy 1.0
          --report training/.work/run-code-smoke-report.json
