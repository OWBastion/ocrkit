name: Docker GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "rust/**"
      - "tests/**"
      - "training/**"
      - "scripts/**"
      - "datasets/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/rust.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "rust/**"
      - "tests/**"
      - "training/**"
      - "scripts/**"
      - "datasets/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/python.yml

  build-and-push:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/owbastion/ocrkit
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show pushed image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect ghcr.io/owbastion/ocrkit@${{ steps.build.outputs.digest }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy published digest over SSH
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_COMPOSE_FILE: ${{ vars.DEPLOY_COMPOSE_FILE }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}" "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_COMPOSE_FILE:?Missing DEPLOY_COMPOSE_FILE}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}" "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$DEPLOY_COMPOSE_FILE" =~ ^[a-zA-Z0-9._/-]+$ ]]
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "Skip deployment: main has advanced."
            exit 0
          fi
          key_file="$RUNNER_TEMP/deploy_key"
          hosts_file="$RUNNER_TEMP/deploy_known_hosts"
          trap 'shred -u "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$IMAGE_DIGEST" "$DEPLOY_COMPOSE_FILE" < .github/scripts/deploy.sh
