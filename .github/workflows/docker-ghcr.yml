name: Docker GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Checkout private OCR fixtures
        env:
          OCRKIT_DATASETS_TOKEN: ${{ secrets.OCRKIT_DATASETS_TOKEN }}
        run: |
          test -n "$OCRKIT_DATASETS_TOKEN"
          auth="$(printf 'x-access-token:%s' "$OCRKIT_DATASETS_TOKEN" | base64 --wrap=0)"
          git config --local submodule.datasets.url https://github.com/OWBastion/ocrkit-datasets.git
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install test dependencies
        run: uv sync --locked --extra dev

      - name: Run pytest
        run: uv run pytest -q

      - name: Run OCR fixture evaluation
        run: uv run python scripts/batch_eval.py --min-field-accuracy 0.9604221635883905

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/owbastion/ocrkit
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show pushed image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect ghcr.io/owbastion/ocrkit@${{ steps.build.outputs.digest }}
