# ROI-scoped deterministic terminology normalization rules.
#
# Each scope maps one terminology family (allowed canonical terms) to a set of
# layout versions and an ROI. Rules apply in order: exact alias, then known
# character-confusion mapping (adopted only when the result is an allowed term),
# then optional constrained fuzzy matching against the allowed terms.
#
# Changing a rule requires bumping `rules_version` and adding regression tests.
# A platform-reviewed correction must not be added here automatically; it only
# becomes a rule after explicit review and a versioned change in OCRKit.

rules_version: "2"

# The v6/v1 layouts are kept so historical datasets recorded under them still normalize.
scopes:
  - id: left_panel.challenge_stats
    roi: left_panel
    layout_versions: ["1280x720-v6", "1280x800-v1", "1280x720-v7", "1280x800-v2", "1280x720-v8", "1280x800-v3"]
    allowed_terms: ["增益", "减益", "总计", "心之钢", "移速", "减伤", "治疗"]
    aliases:
      "编益": "增益"
      "疗%": "治疗%"
    confusions:
      "编": "增"
      "锅": "钢"
